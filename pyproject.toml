[project]
name = "dice-craft"
version = "0.1.0"
description = "基于多Agent的桌游创作与游玩平台"
readme = "README.md"
authors = [
    { name = "yyhhenry", email = "yyhhenry@foxmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "anthropic>=0.104.1",
    "openai>=2.38.0",
    "typer>=0.25.1",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
dice-craft = "dice_craft.__main__:cli"

[tool.ruff.lint]
future-annotations = true
extend-select = [
    "UP",  # pyupgrade
    "I",   # isort
]
extend-safe-fixes = [
    "UP037",  # Add `from __future__ import annotations`
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]
